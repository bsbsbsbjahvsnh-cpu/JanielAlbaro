<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janiel I. Albaro | Portfolio</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b2030;--muted:#5d6579;--accent:#3b5bdb;--line:#e1e5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1f2b;--text:#e8ebf5;--muted:#9aa3ba;--accent:#7c93ff;--line:#2b3144;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px;flex-wrap:wrap}
.logo{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--accent)}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
.links a.active{background:var(--accent);color:#fff}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.hero{text-align:center}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;position:absolute;inset:0}
.avatar span{position:relative;z-index:0}
.avatar{position:relative;width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 10px}
h1{margin:4px 0}h2{margin:0 0 12px}h3{margin:0 0 8px}
.muted{color:var(--muted)}
dl{display:grid;grid-template-columns:1fr;gap:10px;margin:0}
dt{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
dd{margin:0}
@media(min-width:600px){dl{grid-template-columns:1fr 1fr}}
ol.timeline{list-style:none;margin:0;padding:0}
ol.timeline li{padding:0 0 16px 18px;border-left:2px solid var(--accent);position:relative}
ol.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;font-size:12px;padding:2px 10px;margin-left:6px}
.pager{display:flex;justify-content:space-between;margin-top:8px}
.pager button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.loyalty{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.ach{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.ach img{width:100%;height:260px;object-fit:cover;display:block;cursor:zoom-in}
.ach figcaption{padding:10px 12px;font-size:13px}
.ach figcaption span{display:block;color:var(--muted);margin-top:2px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.open{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain}
